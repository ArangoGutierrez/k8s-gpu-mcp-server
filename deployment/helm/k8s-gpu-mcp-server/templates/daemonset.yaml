{{- /* Validate GPU configuration before rendering */}}
{{- include "k8s-gpu-mcp-server.validateGPUConfig" . }}

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "k8s-gpu-mcp-server.fullname" . }}
  namespace: {{ include "k8s-gpu-mcp-server.namespace" . }}
  labels:
    {{- include "k8s-gpu-mcp-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpu-diagnostics
spec:
  selector:
    matchLabels:
      {{- include "k8s-gpu-mcp-server.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "k8s-gpu-mcp-server.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gpu-diagnostics
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- /* RuntimeClass for GPU access (recommended) */}}
      {{- if .Values.gpu.runtimeClass.enabled }}
      runtimeClassName: {{ .Values.gpu.runtimeClass.name }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      serviceAccountName: {{ include "k8s-gpu-mcp-server.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Enable headless service DNS for per-pod routing.
           This configures a per-pod DNS name only when:
           - transport.mode is "http", and
           - service.headless is true and the headless Service is deployed.
           DNS-based pod routing in the gateway code requires this to be enabled.
           Without subdomain, pods won't be resolvable via headless Service DNS.
           See docs/troubleshooting/cross-node-networking.md */}}
      {{- if and (eq .Values.transport.mode "http") .Values.service.headless }}
      subdomain: {{ include "k8s-gpu-mcp-server.fullname" . }}
      {{- end }}
      {{- /* DRA ResourceClaims (K8s 1.26+) */}}
      {{- if .Values.gpu.resourceClaim.enabled }}
      resourceClaims:
      - name: {{ .Values.gpu.resourceClaim.name }}
        {{- if .Values.gpu.resourceClaim.templateName }}
        resourceClaimTemplateName: {{ .Values.gpu.resourceClaim.templateName }}
        {{- else if .Values.gpu.resourceClaim.spec }}
        resourceClaimName: {{ include "k8s-gpu-mcp-server.fullname" . }}-gpu
        {{- end }}
      {{- end }}
      {{- /* Init container to wait for DCGM socket in external mode */}}
      {{- if and .Values.agent.dcgm.enabled (eq .Values.agent.dcgm.mode "external") }}
      initContainers:
      - name: wait-for-dcgm-socket
        image: busybox:1.37-musl
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          SOCKET="{{ .Values.agent.dcgm.socket }}"
          TIMEOUT="{{ default "60" .Values.agent.dcgm.socketWaitTimeout }}"
          echo "Waiting for DCGM socket at ${SOCKET} (timeout: ${TIMEOUT}s)..."
          ELAPSED=0
          while [ ! -S "${SOCKET}" ]; do
            if [ ${ELAPSED} -ge ${TIMEOUT} ]; then
              echo "ERROR: Timeout waiting for DCGM socket at ${SOCKET}"
              echo "Ensure nv-hostengine is running on this node or switch to embedded mode"
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
            echo "Waiting for socket... (${ELAPSED}s/${TIMEOUT}s)"
          done
          echo "DCGM socket found at ${SOCKET}"
        volumeMounts:
        - name: dcgm-socket-dir
          mountPath: {{ dir .Values.agent.dcgm.socket }}
          readOnly: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      {{- end }}
      containers:
      - name: agent
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- if eq .Values.transport.mode "http" }}
        {{- /* HTTP mode: run agent with --port flag */}}
        command: ["/agent"]
        args:
        - "--nvml-mode={{ .Values.agent.nvmlMode }}"
        - "--port={{ .Values.transport.http.port }}"
        - "--addr={{ .Values.transport.http.addr }}"
        - "--mode={{ default "read-only" .Values.agent.mode }}"
        {{- if .Values.agent.dcgm.enabled }}
        - "--dcgm-enabled=true"
        - "--dcgm-mode={{ .Values.agent.dcgm.mode }}"
        {{- if eq .Values.agent.dcgm.mode "external" }}
        - "--dcgm-socket={{ .Values.agent.dcgm.socket }}"
        {{- else }}
        - "--dcgm-port={{ .Values.agent.dcgm.embeddedPort }}"
        {{- end }}
        {{- if .Values.agent.dcgm.watchInterval }}
        - "--dcgm-interval={{ .Values.agent.dcgm.watchInterval }}"
        {{- end }}
        {{- if .Values.agent.dcgm.enableProfiling }}
        - "--dcgm-profiling=true"
        {{- end }}
        {{- end }}
        {{- if and .Values.tls.enabled .Values.tls.secretName }}
        - "--tls-cert-file=/etc/tls/agent/tls.crt"
        - "--tls-key-file=/etc/tls/agent/tls.key"
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.transport.http.port }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
            {{- if and .Values.tls.enabled .Values.tls.secretName }}
            scheme: HTTPS
            {{- end }}
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
            {{- if and .Values.tls.enabled .Values.tls.secretName }}
            scheme: HTTPS
            {{- end }}
          initialDelaySeconds: 5
          periodSeconds: 10
        {{- else }}
        {{- /* Stdio mode: Sleep until kubectl exec invokes the agent */}}
        {{- /* Requires image with busybox (see deployment/Containerfile) */}}
        command: ["sleep", "infinity"]
        stdin: true
        tty: true
        {{- end }}
        env:
        {{- /* Kubernetes metadata for structured logging */}}
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if .Values.processTracking.enabled }}
        {{- /* ProcessMapper requires host /proc mounted at /host/proc */}}
        - name: PROC_PATH
          value: "/host/proc"
        {{- end }}
        {{- if .Values.gpu.runtimeClass.enabled }}
        {{- /* Required for nvidia-container-runtime to inject GPU libraries */}}
        {{- /* This enables GPU access without requesting nvidia.com/gpu resources */}}
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        {{- end }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        resources:
          {{- if .Values.gpu.resourceRequest.enabled }}
          {{- /* Device Plugin: Merge GPU resource request with user-defined resources */}}
          requests:
            {{- with .Values.resources.requests }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          limits:
            {{- with .Values.resources.limits }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{ .Values.gpu.resourceRequest.resource }}: {{ .Values.gpu.resourceRequest.count | quote }}
          {{- else if .Values.gpu.resourceClaim.enabled }}
          {{- /* DRA: Merge base resources with claims reference */}}
          {{- $draResources := merge (dict "claims" (list (dict "name" .Values.gpu.resourceClaim.name))) .Values.resources }}
          {{- toYaml $draResources | nindent 10 }}
          {{- else }}
          {{- /* RuntimeClass: No GPU resource request - monitors all GPUs */}}
          {{- toYaml .Values.resources | nindent 10 }}
          {{- end }}
        {{- if or .Values.xidAnalysis.enabled .Values.processTracking.enabled (and .Values.agent.dcgm.enabled (eq .Values.agent.dcgm.mode "external")) (and .Values.tls.enabled .Values.tls.secretName) }}
        volumeMounts:
        {{- if .Values.xidAnalysis.enabled }}
        - name: kmsg
          mountPath: /dev/kmsg
          readOnly: true
        {{- end }}
        {{- if .Values.processTracking.enabled }}
        - name: host-proc
          mountPath: /host/proc
          readOnly: true
        {{- end }}
        {{- if and .Values.agent.dcgm.enabled (eq .Values.agent.dcgm.mode "external") }}
        {{- /* Mount parent directory; socket is accessed via full path inside */}}
        - name: dcgm-socket-dir
          mountPath: {{ dir .Values.agent.dcgm.socket }}
          readOnly: true
        {{- end }}
        {{- if and .Values.tls.enabled .Values.tls.secretName }}
        - name: tls-certs
          mountPath: /etc/tls/agent
          readOnly: true
        {{- end }}
        {{- end }}
      {{- if or .Values.xidAnalysis.enabled .Values.processTracking.enabled (and .Values.agent.dcgm.enabled (eq .Values.agent.dcgm.mode "external")) (and .Values.tls.enabled .Values.tls.secretName) }}
      volumes:
      {{- if .Values.xidAnalysis.enabled }}
      - name: kmsg
        hostPath:
          path: /dev/kmsg
          type: CharDevice
      {{- end }}
      {{- if .Values.processTracking.enabled }}
      - name: host-proc
        hostPath:
          path: /proc
          type: Directory
      {{- end }}
      {{- if and .Values.agent.dcgm.enabled (eq .Values.agent.dcgm.mode "external") }}
      {{- /* Mount socket's parent directory to allow init container to wait for socket.
             Using Directory type instead of Socket prevents scheduling failures when
             the socket doesn't exist yet (nv-hostengine not running). */}}
      - name: dcgm-socket-dir
        hostPath:
          path: {{ dir .Values.agent.dcgm.socket }}
          type: Directory
      {{- end }}
      {{- if and .Values.tls.enabled .Values.tls.secretName }}
      - name: tls-certs
        secret:
          secretName: {{ .Values.tls.secretName }}
      {{- end }}
      {{- end }}

