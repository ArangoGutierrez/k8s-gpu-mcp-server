{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-gpu-mcp-server.fullname" . }}-gateway
  namespace: {{ include "k8s-gpu-mcp-server.namespace" . }}
  labels:
    {{- include "k8s-gpu-mcp-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "k8s-gpu-mcp-server.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "k8s-gpu-mcp-server.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "k8s-gpu-mcp-server.serviceAccountName" . }}-gateway
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if gt (int .Values.gateway.replicas) 1 }}
      affinity:
        podAntiAffinity:
          {{- if eq (default "soft" .Values.gateway.antiAffinity) "hard" }}
          # Hard anti-affinity: strictly one gateway pod per node.
          # Pods will be unschedulable if there are fewer nodes than replicas.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "k8s-gpu-mcp-server.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: gateway
              topologyKey: kubernetes.io/hostname
          {{- else }}
          # Soft anti-affinity (default): best-effort pod spreading across nodes.
          # Pods may co-locate if no other node is available.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "k8s-gpu-mcp-server.selectorLabels" . | nindent 20 }}
                    app.kubernetes.io/component: gateway
                topologyKey: kubernetes.io/hostname
          {{- end }}
      {{- end }}
      containers:
      - name: gateway
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/agent"]
        args:
        - "--gateway"
        - "--port={{ .Values.gateway.port }}"
        - "--namespace={{ include "k8s-gpu-mcp-server.namespace" . }}"
        - "--mode={{ .Values.agent.mode }}"
        - "--routing-mode={{ .Values.gateway.routingMode }}"
        env:
        {{- /* Kubernetes metadata for structured logging */}}
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: EXEC_TIMEOUT
          value: {{ .Values.gateway.execTimeout | default "60s" | quote }}
        ports:
        - name: http
          containerPort: {{ .Values.gateway.port }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          {{- toYaml .Values.gateway.resources | nindent 10 }}
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
{{- end }}

